services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: jasi
      POSTGRES_USER: jasi
      POSTGRES_PASSWORD: jasi
    ports:
      - "5432:5432"
    volumes:
      - jasi-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jasi -d jasi"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  jasi-postgres:
