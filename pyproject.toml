[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jasi"
version = "0.1.0"
description = "Telegram passive chat MVP with an OpenAI-compatible runtime and PostgreSQL outbox."
requires-python = ">=3.12"
dependencies = [
  "SQLAlchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29.0",
  "alembic>=1.13.1",
  "httpx>=0.27.0",
  "croniter>=6.0.0",
  "pgvector>=0.3.6",
  "markdown-it-py>=3.0.0",
  "jsonschema>=4.23.0",
  "beautifulsoup4>=4.14.0",
  "ddgs>=9.10.0",
  "html2text>=2025.4.0",
]

[dependency-groups]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jasi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: tests that require a real PostgreSQL database",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
